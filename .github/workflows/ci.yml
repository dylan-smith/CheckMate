name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

# Runs on main deploy to production, so only one runs at a time: another run's Bicep deployment or backend
# deploy mustn't reconfigure, restart or resume the API while this one has it paused (see deploy-backend). A
# workflow-level group holds the lock for the whole infrastructure, backend and frontend sequence, which
# job-level groups can't. Never cancel a running deployment: stopping it partway through migrations would leave
# the API paused. A newer main run waiting its turn replaces an older waiting one, which is fine since it has
# the newer code. Other runs (pull requests) get a group of their own, so they never wait.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'production-deploy' || format('ci-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      checks: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Initialize CodeQL
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/init@v4.38.1
        with:
          languages: csharp
          build-mode: manual
          queries: security-and-quality

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Verify formatting
        run: dotnet format CheckMate.slnx --verify-no-changes --no-restore

      - name: Test
        run: dotnet test --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Publish Backend Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          check_name: Backend Test Results
          comment_mode: 'off'
          files: "**/TestResults/*.trx"
          json_file: backend-test-results.json

      - name: Upload Backend Test Results Summary
        uses: actions/upload-artifact@v7
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          name: test-results-backend
          path: backend-test-results.json
          if-no-files-found: warn

      - name: Perform CodeQL Analysis
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/analyze@v4.38.1
        with:
          category: "/language:csharp"

  frontend:
    name: Frontend Build, Lint & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      checks: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Initialize CodeQL
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/init@v4.38.1
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-and-quality

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -b

      - name: Build
        run: npx vite build

      - name: Lint
        run: npx eslint .

      - name: Verify formatting
        run: npx prettier --check .

      - name: Test
        run: npm test

      - name: Publish Frontend Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          check_name: Frontend Test Results
          comment_mode: 'off'
          files: "frontend/vitest-report/results.xml"
          json_file: frontend-test-results.json

      - name: Upload Frontend Test Results Summary
        uses: actions/upload-artifact@v7
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          name: test-results-frontend
          path: frontend-test-results.json
          if-no-files-found: warn

      - name: Perform CodeQL Analysis
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/analyze@v4.38.1
        with:
          category: "/language:javascript-typescript"

  e2e-tests:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    permissions:
      contents: read
      checks: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Restore backend dependencies
        run: dotnet restore
        working-directory: .
      - name: Build backend
        run: dotnet build --no-restore
        working-directory: .
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - name: Build frontend
        run: VITE_API_BASE_URL=http://localhost:5269 npm run build
      - name: Run Playwright tests
        env:
          VITE_API_BASE_URL: http://localhost:5269
        run: npx playwright test
      - name: Publish E2E Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          check_name: E2E Test Results
          comment_mode: 'off'
          files: "frontend/playwright-report/results.xml"
          json_file: e2e-test-results.json
      - name: Upload E2E Test Results Summary
        uses: actions/upload-artifact@v7
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          name: test-results-e2e
          path: e2e-test-results.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

  test-results-comment:
    name: Test Results PR Comment
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e-tests]
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    # Serialize the find-then-create/update so overlapping runs on one PR can't both create a comment.
    concurrency:
      group: test-results-comment-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Only the comment script is needed. Check out before downloading, since checkout cleans the workspace.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - name: Download test result summaries
        uses: actions/download-artifact@v8
        with:
          pattern: test-results-*
          merge-multiple: true
          path: test-results

      - name: Create or update PR comment
        uses: actions/github-script@v9
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          E2E_RESULT: ${{ needs['e2e-tests'].result }}
        with:
          script: |
            const run = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/test-results-comment.cjs`);
            await run({ github, context });

  infrastructure-what-if:
    name: Infrastructure What-If (Bicep)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    # No environment: PR runs use a separate read-and-preview-only identity and never get the
    # production environment's credentials or secrets.
    # Serialize the find-then-create/update of the PR comment so overlapping runs on one PR can't both create one.
    concurrency:
      group: infrastructure-what-if-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      # What-if reports false positives (noise) for this template on every run, so the PR's changes are the ones
      # it reports beyond those it reports for main.
      - name: Checkout main for comparison
        uses: actions/checkout@v7
        with:
          ref: ${{ github.base_ref }}
          path: baseline
          sparse-checkout: infra

      - name: Lint Bicep templates
        run: az bicep lint --file infra/main.bicep

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_WHATIF_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Preview infrastructure changes
        shell: bash
        run: |
          az deployment group what-if \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam \
            --validation-level ProviderNoRbac \
            --exclude-change-types Ignore NoChange \
            | tee "${RUNNER_TEMP}/what-if.txt"
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          # What-if can't read existing app setting values, so the real secret adds nothing to the
          # preview; keep it out of PR runs, whose workflow definition comes from the PR branch.
          AZURE_SQL_CONNECTION_STRING: what-if-placeholder
          AZURE_CORE_NO_COLOR: 'true'

      # If this fails (say main's templates are broken), the comment shows every change instead of failing the PR.
      - name: Preview main's infrastructure changes
        id: baseline
        continue-on-error: true
        shell: bash
        run: |
          az deployment group what-if \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --template-file baseline/infra/main.bicep \
            --parameters baseline/infra/main.bicepparam \
            --validation-level ProviderNoRbac \
            --exclude-change-types Ignore NoChange \
            > "${RUNNER_TEMP}/baseline-what-if.txt"
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_SQL_CONNECTION_STRING: what-if-placeholder
          AZURE_CORE_NO_COLOR: 'true'

      - name: Comment infrastructure changes on PR
        uses: actions/github-script@v9
        env:
          WHAT_IF_OUTPUT: ${{ runner.temp }}/what-if.txt
          BASELINE_WHAT_IF_OUTPUT: ${{ runner.temp }}/baseline-what-if.txt
          BASELINE_OK: ${{ steps.baseline.outcome == 'success' }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        with:
          script: |
            const run = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/what-if-comment.cjs`);
            await run({ github, context });

  deploy-infrastructure:
    name: Deploy Infrastructure (Bicep)
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e-tests]
    if: github.ref == 'refs/heads/main'
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep template
        shell: bash
        run: |
          az deployment group create \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --name "ci-${GITHUB_RUN_ID}" \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam \
            --only-show-errors \
            --output none
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_SQL_CONNECTION_STRING: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}

      # Static website hosting is a data-plane setting that ARM templates can't manage.
      - name: Enable static website hosting
        shell: bash
        run: |
          az storage blob service-properties update \
            --account-name "${AZURE_STORAGE_ACCOUNT_NAME}" \
            --auth-mode login \
            --static-website \
            --index-document index.html \
            --404-document index.html \
            --only-show-errors \
            --output none
        env:
          AZURE_STORAGE_ACCOUNT_NAME: ${{ vars.AZURE_STORAGE_ACCOUNT_NAME }}

  deploy-backend:
    name: Deploy Backend (ASP.NET Core)
    runs-on: ubuntu-latest
    needs: [deploy-infrastructure]
    if: github.ref == 'refs/heads/main'
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: |
          dotnet restore backend/CheckMate.Api/CheckMate.Api.csproj
          dotnet restore backend/CheckMate.Database/CheckMate.Database.csproj

      - name: Build
        run: |
          dotnet build backend/CheckMate.Api/CheckMate.Api.csproj --configuration Release --no-restore
          dotnet build backend/CheckMate.Database/CheckMate.Database.csproj --configuration Release --no-restore

      - name: Publish API
        run: dotnet publish backend/CheckMate.Api/CheckMate.Api.csproj --configuration Release --no-build --output ./backend/publish

      - name: Publish Database CLI
        run: dotnet publish backend/CheckMate.Database/CheckMate.Database.csproj --configuration Release --no-build --output ./backend/database-publish

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Installed before the API is paused so the install doesn't add to the downtime.
      - name: Install SqlPackage
        run: dotnet tool install --global microsoft.sqlpackage

      # Pause the API from before the backup until the new version is deployed, so the old API never runs
      # against the migrated database (and the backup can't miss writes made after it).
      - name: Pause API
        id: pause
        run: bash .github/scripts/pause-api.sh
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_BACKEND_APP_NAME: ${{ vars.AZURE_BACKEND_APP_NAME }}
          AZURE_BACKEND_URL: ${{ vars.AZURE_BACKEND_URL }}

      # Back up the database before every migration run. The backup goes to the db-backups container, and
      # its lifecycle policy (infra/modules/storage.bicep) deletes old copies. If this fails, migrations don't run.
      - name: Backup database (BACPAC)
        run: bash .github/scripts/backup-database.sh
        env:
          CONNECTION_STRING: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}

      - name: Upload backup to Blob Storage
        shell: bash
        run: |
          az storage blob upload \
            --account-name "${AZURE_STORAGE_ACCOUNT_NAME}" \
            --auth-mode login \
            --container-name db-backups \
            --name "${BACKUP_FILE}" \
            --file "${RUNNER_TEMP}/${BACKUP_FILE}" \
            --only-show-errors \
            --output none
          echo "Backed up to db-backups/${BACKUP_FILE}" >> "$GITHUB_STEP_SUMMARY"
        env:
          AZURE_STORAGE_ACCOUNT_NAME: ${{ vars.AZURE_STORAGE_ACCOUNT_NAME }}

      - name: Run database migrations
        id: migrate
        run: ./backend/database-publish/CheckMate.Database "$CONNECTION_STRING"
        env:
          CONNECTION_STRING: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}

      - name: Deploy to Azure App Service
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_BACKEND_APP_NAME }}
          package: ./backend/publish

      # Resume only if this run paused the API (so a run that fails before pausing never resumes one an earlier
      # run left paused), and then either after the new API deploys, or after a failure or cancellation before
      # migrations started, since the database then still matches the running API. That last case needs the API to
      # have been live when this run paused it: if an earlier run left it paused, its migrations may have changed
      # the database.
      - name: Resume API
        id: resume
        if: >-
          always() && steps.pause.outcome != 'skipped' && (steps.deploy.outcome == 'success' ||
          (steps.migrate.outcome == 'skipped' && steps.pause.outputs['was-live'] == 'true'))
        run: bash .github/scripts/resume-api.sh
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_BACKEND_APP_NAME: ${{ vars.AZURE_BACKEND_APP_NAME }}

      - name: Report API left paused
        if: always() && steps.pause.outcome != 'skipped' && steps.resume.outcome != 'success'
        run: echo "::error::The API is still paused, so it isn't serving users. Either a deployment stopped after its migrations started (this run or an earlier one), or resuming failed. Deploy a fix, or restore the backup and remove the app's deploy-pause-* access restriction rules."

  deploy-frontend:
    name: Deploy Frontend (React)
    runs-on: ubuntu-latest
    needs: deploy-backend
    if: github.ref == 'refs/heads/main'
    environment: production
    outputs:
      frontend-origin: ${{ steps['resolve-frontend-origin'].outputs['frontend-origin'] }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.AZURE_BACKEND_URL }}

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Storage Account
        run: npm run deploy
        working-directory: frontend
        env:
          AZURE_STORAGE_ACCOUNT_NAME: ${{ vars.AZURE_STORAGE_ACCOUNT_NAME }}

      - name: Resolve frontend origin
        id: resolve-frontend-origin
        shell: bash
        run: |
          FRONTEND_ORIGIN="$(az storage account show \
            --name "${AZURE_STORAGE_ACCOUNT_NAME}" \
            --query 'primaryEndpoints.web' \
            --output tsv)"
          FRONTEND_ORIGIN="${FRONTEND_ORIGIN%/}"
          echo "frontend-origin=${FRONTEND_ORIGIN}" >> "$GITHUB_OUTPUT"
        env:
          AZURE_STORAGE_ACCOUNT_NAME: ${{ vars.AZURE_STORAGE_ACCOUNT_NAME }}

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy-frontend
    if: github.ref == 'refs/heads/main'
    environment: production
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: Run smoke tests
        env:
          SMOKE_BASE_URL: ${{ needs['deploy-frontend'].outputs['frontend-origin'] }}
          # The smoke tests first poll the API until it's healthy (see e2e/smoke.global-setup.ts).
          SMOKE_API_URL: ${{ vars.AZURE_BACKEND_URL }}
        run: npm run test:smoke

      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: smoke-test-report
          path: |
            frontend/playwright-report/smoke/
            frontend/playwright-report/smoke-results.xml
          retention-days: 30
