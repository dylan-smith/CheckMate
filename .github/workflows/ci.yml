name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      checks: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Initialize CodeQL
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/init@v4.38.1
        with:
          languages: csharp
          build-mode: manual
          queries: security-and-quality

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Verify formatting
        run: dotnet format CheckMate.slnx --verify-no-changes --no-restore

      - name: Test
        run: dotnet test --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Publish Backend Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          check_name: Backend Test Results
          comment_mode: 'off'
          files: "**/TestResults/*.trx"
          json_file: backend-test-results.json

      - name: Upload Backend Test Results Summary
        uses: actions/upload-artifact@v7
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          name: test-results-backend
          path: backend-test-results.json
          if-no-files-found: warn

      - name: Perform CodeQL Analysis
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/analyze@v4.38.1
        with:
          category: "/language:csharp"

  frontend:
    name: Frontend Build, Lint & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      checks: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Initialize CodeQL
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/init@v4.38.1
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-and-quality

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -b

      - name: Build
        run: npx vite build

      - name: Lint
        run: npx eslint .

      - name: Verify formatting
        run: npx prettier --check .

      - name: Test
        run: npm test

      - name: Publish Frontend Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          check_name: Frontend Test Results
          comment_mode: 'off'
          files: "frontend/vitest-report/results.xml"
          json_file: frontend-test-results.json

      - name: Upload Frontend Test Results Summary
        uses: actions/upload-artifact@v7
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          name: test-results-frontend
          path: frontend-test-results.json
          if-no-files-found: warn

      - name: Perform CodeQL Analysis
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/analyze@v4.38.1
        with:
          category: "/language:javascript-typescript"

  e2e-tests:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    permissions:
      contents: read
      checks: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Restore backend dependencies
        run: dotnet restore
        working-directory: .
      - name: Build backend
        run: dotnet build --no-restore
        working-directory: .
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - name: Build frontend
        run: VITE_API_BASE_URL=http://localhost:5269 npm run build
      - name: Run Playwright tests
        env:
          VITE_API_BASE_URL: http://localhost:5269
        run: npx playwright test
      - name: Publish E2E Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          check_name: E2E Test Results
          comment_mode: 'off'
          files: "frontend/playwright-report/results.xml"
          json_file: e2e-test-results.json
      - name: Upload E2E Test Results Summary
        uses: actions/upload-artifact@v7
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          name: test-results-e2e
          path: e2e-test-results.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

  test-results-comment:
    name: Test Results PR Comment
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e-tests]
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    # Serialize the find-then-create/update so overlapping runs on one PR can't both create a comment.
    concurrency:
      group: test-results-comment-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      pull-requests: write
    steps:
      - name: Download test result summaries
        uses: actions/download-artifact@v8
        with:
          pattern: test-results-*
          merge-multiple: true
          path: test-results

      - name: Create or update PR comment
        uses: actions/github-script@v9
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          E2E_RESULT: ${{ needs['e2e-tests'].result }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- checkmate-test-results -->';
            const sections = [
              { title: 'Backend Tests', file: 'backend', result: process.env.BACKEND_RESULT },
              { title: 'Frontend Unit Tests', file: 'frontend', result: process.env.FRONTEND_RESULT },
              { title: 'E2E Tests', file: 'e2e', result: process.env.E2E_RESULT },
            ];

            // Each test job writes its results as JSON via publish-unit-test-result-action (json_file).
            const body = [marker, '# Test Results'];
            for (const section of sections) {
              const path = `test-results/${section.file}-test-results.json`;
              if (!fs.existsSync(path)) {
                body.push(`## ⚠️ ${section.title}`, `No test results were produced (job ${section.result}).`);
                continue;
              }
              const results = JSON.parse(fs.readFileSync(path, 'utf8'));
              const icon = results.conclusion === 'success' ? '✅' : '❌';
              body.push(`## ${icon} ${section.title}`, results.summary.trim());
              if (results.conclusion !== 'success') {
                body.push(`[View failure details](${results.check_url})`);
              }
            }

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.user.type === 'Bot' && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: body.join('\n\n') });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: body.join('\n\n') });
            }

  infrastructure-what-if:
    name: Infrastructure What-If (Bicep)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    # No environment: PR runs use a separate read-and-preview-only identity and never get the
    # production environment's credentials or secrets.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Lint Bicep templates
        run: az bicep lint --file infra/main.bicep

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_WHATIF_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Preview infrastructure changes
        shell: bash
        run: |
          az deployment group what-if \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam \
            --validation-level ProviderNoRbac \
            --exclude-change-types Ignore NoChange
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          # What-if can't read existing app setting values, so the real secret adds nothing to the
          # preview; keep it out of PR runs, whose workflow definition comes from the PR branch.
          AZURE_SQL_CONNECTION_STRING: what-if-placeholder

  deploy-infrastructure:
    name: Deploy Infrastructure (Bicep)
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e-tests]
    if: github.ref == 'refs/heads/main'
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep template
        shell: bash
        run: |
          az deployment group create \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --name "ci-${GITHUB_RUN_ID}" \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam \
            --only-show-errors \
            --output none
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_SQL_CONNECTION_STRING: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}

      # Static website hosting is a data-plane setting that ARM templates can't manage.
      - name: Enable static website hosting
        shell: bash
        run: |
          az storage blob service-properties update \
            --account-name "${AZURE_STORAGE_ACCOUNT_NAME}" \
            --auth-mode login \
            --static-website \
            --index-document index.html \
            --404-document index.html \
            --only-show-errors \
            --output none
        env:
          AZURE_STORAGE_ACCOUNT_NAME: ${{ vars.AZURE_STORAGE_ACCOUNT_NAME }}

  deploy-backend:
    name: Deploy Backend (ASP.NET Core)
    runs-on: ubuntu-latest
    needs: [deploy-infrastructure]
    if: github.ref == 'refs/heads/main'
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: |
          dotnet restore backend/CheckMate.Api/CheckMate.Api.csproj
          dotnet restore backend/CheckMate.Database/CheckMate.Database.csproj

      - name: Build
        run: |
          dotnet build backend/CheckMate.Api/CheckMate.Api.csproj --configuration Release --no-restore
          dotnet build backend/CheckMate.Database/CheckMate.Database.csproj --configuration Release --no-restore

      - name: Publish API
        run: dotnet publish backend/CheckMate.Api/CheckMate.Api.csproj --configuration Release --no-build --output ./backend/publish

      - name: Publish Database CLI
        run: dotnet publish backend/CheckMate.Database/CheckMate.Database.csproj --configuration Release --no-build --output ./backend/database-publish

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Installed before the API is paused so the install doesn't add to the downtime.
      - name: Install SqlPackage
        run: dotnet tool install --global microsoft.sqlpackage

      # Pause the API from before the backup until the new version is deployed, so the old API never runs
      # against the migrated database (and the backup can't miss writes made after it). Denying all public
      # traffic stops requests reaching the old API while leaving the deployment (SCM) site reachable; the
      # API has no background work, so without requests it doesn't touch the database.
      - name: Pause API
        shell: bash
        run: |
          az webapp config access-restriction set \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --name "${AZURE_BACKEND_APP_NAME}" \
            --default-action Deny \
            --scm-default-action Allow \
            --use-same-restrictions-for-scm-site false \
            --only-show-errors \
            --output none
          # Wait until the restriction is enforced, then give in-flight requests time to finish.
          for attempt in $(seq 1 24); do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 10 "${AZURE_BACKEND_URL}/api/checklists" || true)"
            if [ "${status}" = "403" ]; then
              echo "API paused"
              sleep 15
              exit 0
            fi
            echo "API still answering (HTTP ${status}); checking again in 5 seconds"
            sleep 5
          done
          echo "::error::API was still reachable 2 minutes after pausing it"
          exit 1
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_BACKEND_APP_NAME: ${{ vars.AZURE_BACKEND_APP_NAME }}
          AZURE_BACKEND_URL: ${{ vars.AZURE_BACKEND_URL }}

      # Back up the database before every migration run. The backup goes to the db-backups container, and
      # its lifecycle policy (infra/modules/storage.bicep) deletes old copies. If this fails, migrations don't run.
      - name: Export database (BACPAC)
        shell: bash
        # Uses the same connection string as the migrations so the backup is always of the database they change.
        # Retries cover the serverless database resuming from auto-pause, like DbUpRunner does.
        run: |
          BACKUP_FILE="CheckMate-$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA::7}.bacpac"
          for attempt in 1 2 3 4 5; do
            if sqlpackage /Action:Export \
              /SourceConnectionString:"${CONNECTION_STRING}" \
              /TargetFile:"${RUNNER_TEMP}/${BACKUP_FILE}"; then
              break
            fi
            if [ "${attempt}" -eq 5 ]; then
              echo "::error::Database export failed after ${attempt} attempts"
              exit 1
            fi
            echo "Export attempt ${attempt} failed; retrying in 15 seconds"
            rm -f "${RUNNER_TEMP}/${BACKUP_FILE}"
            sleep 15
          done
          echo "BACKUP_FILE=${BACKUP_FILE}" >> "$GITHUB_ENV"
        env:
          CONNECTION_STRING: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}

      - name: Upload backup to Blob Storage
        shell: bash
        run: |
          az storage blob upload \
            --account-name "${AZURE_STORAGE_ACCOUNT_NAME}" \
            --auth-mode login \
            --container-name db-backups \
            --name "${BACKUP_FILE}" \
            --file "${RUNNER_TEMP}/${BACKUP_FILE}" \
            --only-show-errors \
            --output none
          echo "Backed up to db-backups/${BACKUP_FILE}" >> "$GITHUB_STEP_SUMMARY"
        env:
          AZURE_STORAGE_ACCOUNT_NAME: ${{ vars.AZURE_STORAGE_ACCOUNT_NAME }}

      - name: Run database migrations
        id: migrate
        run: ./backend/database-publish/CheckMate.Database "$CONNECTION_STRING"
        env:
          CONNECTION_STRING: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_BACKEND_APP_NAME }}
          package: ./backend/publish

      # Also resume after a failure, but only if migrations never started: then the database still matches the
      # old API. Once they've started, the API and database may not match, so it stays paused until a fix is
      # deployed.
      - name: Resume API
        if: success() || (failure() && steps.migrate.outcome == 'skipped')
        shell: bash
        run: |
          az webapp config access-restriction set \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --name "${AZURE_BACKEND_APP_NAME}" \
            --default-action Allow \
            --only-show-errors \
            --output none
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_BACKEND_APP_NAME: ${{ vars.AZURE_BACKEND_APP_NAME }}

      - name: Report API left paused
        if: failure() && steps.migrate.outcome != 'skipped'
        run: echo "::error::The API is still paused because the deployment failed after migrations started. Deploy a fix, or restore the backup and allow public access to the app again."

  deploy-frontend:
    name: Deploy Frontend (React)
    runs-on: ubuntu-latest
    needs: deploy-backend
    if: github.ref == 'refs/heads/main'
    environment: production
    outputs:
      frontend-origin: ${{ steps['resolve-frontend-origin'].outputs['frontend-origin'] }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.AZURE_BACKEND_URL }}

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Storage Account
        run: npm run deploy
        working-directory: frontend
        env:
          AZURE_STORAGE_ACCOUNT_NAME: ${{ vars.AZURE_STORAGE_ACCOUNT_NAME }}

      - name: Resolve frontend origin
        id: resolve-frontend-origin
        shell: bash
        run: |
          FRONTEND_ORIGIN="$(az storage account show \
            --name "${AZURE_STORAGE_ACCOUNT_NAME}" \
            --query 'primaryEndpoints.web' \
            --output tsv)"
          FRONTEND_ORIGIN="${FRONTEND_ORIGIN%/}"
          echo "frontend-origin=${FRONTEND_ORIGIN}" >> "$GITHUB_OUTPUT"
        env:
          AZURE_STORAGE_ACCOUNT_NAME: ${{ vars.AZURE_STORAGE_ACCOUNT_NAME }}

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy-frontend
    if: github.ref == 'refs/heads/main'
    environment: production
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: Run smoke tests
        env:
          SMOKE_BASE_URL: ${{ needs['deploy-frontend'].outputs['frontend-origin'] }}
          # The smoke tests first poll the API until it's healthy (see e2e/smoke.global-setup.ts).
          SMOKE_API_URL: ${{ vars.AZURE_BACKEND_URL }}
        run: npm run test:smoke

      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: smoke-test-report
          path: |
            frontend/playwright-report/smoke/
            frontend/playwright-report/smoke-results.xml
          retention-days: 30
