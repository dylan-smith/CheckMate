name: Dependabot Auto-merge

# Enables auto-merge on Dependabot PRs for patch and minor updates, so they merge once the
# required checks pass. Major updates are left for manual review.
#
# Requires the AUTOMERGE_TOKEN Dependabot secret (Settings > Secrets > Dependabot): a
# fine-grained PAT for this repo with Contents and Pull requests read/write. GITHUB_TOKEN
# can't be used because merges made through it don't trigger the push workflows that deploy.

on: pull_request_target

permissions:
  contents: read
  pull-requests: read # fetch-metadata reads the PR through GITHUB_TOKEN

jobs:
  auto-merge:
    name: Enable auto-merge
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3

      - name: Enable auto-merge
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
