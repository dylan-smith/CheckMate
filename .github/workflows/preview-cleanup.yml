name: Preview Cleanup

# Deletes a pull request's preview environment (see the deploy-preview job in ci.yml) when the PR is closed,
# then sweeps the preview resource group for previews of other closed PRs whose own cleanup failed. The App
# Service plan and SQL server shared by every preview are never deleted.
#
# Both jobs run on pull_request events only: the preview identity's federated credential trusts this
# repository's pull_request tokens, so a scheduled or manual run couldn't log in to Azure.
on:
  pull_request:
    types: [closed]

permissions:
  contents: read

env:
  PREVIEW_RESOURCE_GROUP: CheckMate-Preview

jobs:
  delete:
    name: Delete PR Preview
    runs-on: ubuntu-latest
    # The same PRs deploy-preview deploys: from this repository and not opened by Dependabot (whoever closes it).
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'
    # The same group as deploy-preview, so closing the PR cancels a deployment still running for it.
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      # Only updates the preview comment, so a PR that never had a preview gets none.
      - name: Report preview deletion started
        uses: actions/github-script@v9
        env:
          PREVIEW_STATUS: deleting
          PREVIEW_UPDATE_ONLY: 'true'
        with:
          script: |
            const run = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/preview-comment.cjs`);
            await run({ github, context });

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_PREVIEW_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Delete preview resources
        run: bash .github/scripts/delete-preview.sh

      - name: Update preview comment
        if: ${{ !cancelled() }}
        uses: actions/github-script@v9
        env:
          PREVIEW_STATUS: ${{ job.status == 'success' && 'deleted' || 'delete-failed' }}
          PREVIEW_UPDATE_ONLY: 'true'
        with:
          script: |
            const run = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/preview-comment.cjs`);
            await run({ github, context });

  sweep:
    name: Sweep Orphaned Previews
    runs-on: ubuntu-latest
    needs: delete
    # Runs whether or not this PR's own deletion succeeded, and retries it if it didn't.
    if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' }}
    # One sweep at a time, so two PRs closing together don't delete the same leftovers at once.
    concurrency:
      group: preview-sweep
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_PREVIEW_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Every per-PR resource carries a pr-number tag (infra/preview.bicep). A PR that can't be read is kept,
      # since deleting a live preview is worse than keeping a stale one until the next sweep. One failed
      # deletion doesn't stop the others; the step fails at the end if any did.
      - name: Delete previews whose PR is closed
        shell: bash
        run: |
          listing="$(az resource list \
            --resource-group "${PREVIEW_RESOURCE_GROUP}" \
            --query '[?tags."pr-number"].tags."pr-number"' \
            --output tsv)"
          failed=()
          for pr in $(sort -un <<<"${listing}"); do
            state="$(gh pr view "${pr}" --repo "${GITHUB_REPOSITORY}" --json state --jq .state 2>/dev/null || echo UNKNOWN)"
            case "${state}" in
              OPEN)
                echo "PR #${pr} is open; keeping its preview"
                ;;
              UNKNOWN)
                echo "::warning::Couldn't read PR #${pr}; keeping its preview"
                ;;
              *)
                echo "PR #${pr} is ${state}; deleting its preview"
                if ! PR_NUMBER="${pr}" bash .github/scripts/delete-preview.sh; then
                  echo "::warning::Deleting the preview for PR #${pr} failed"
                  failed+=("#${pr}")
                fi
                ;;
            esac
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::Couldn't delete the previews for PRs ${failed[*]}"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
